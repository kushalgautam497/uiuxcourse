<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    let A = prompt("FIRST NUMBER");
    let B = prompt("SECOND NUMBER");
    let op = prompt("Select operator (+, -, *, /)");

    let x = parseFloat(A);
    let y = parseFloat(B);
    let Result;

    switch (op) {
        case "+":
            Result = x + y;
            break;
        case "-":
            Result = x - y;
            break;
        case "*":
            Result = x * y;
            break;
        case "/":
            Result = (y !== 0) ? x / y : "Error: Division by zero";
            break;
        default:
            Result = "Invalid operation";
    }

    document.write("Result is " + Result);
    let resp = confirm("Do you want to add more?");
</script>

</html>
